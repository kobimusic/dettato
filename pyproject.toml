[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dettato"
version = "2.0.1"
description = "Multi-instrument audio-to-MIDI transcription: notes, instrument-named tracks and drums from any recording"
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Nathan Mills" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "soxr>=0.3",
    "pretty_midi>=0.2.10",
    "huggingface_hub>=0.23",
    "safetensors>=0.4",
]
keywords = [
    "music",
    "transcription",
    "music-transcription",
    "automatic-music-transcription",
    "audio-to-midi",
    "midi",
    "drums",
    "multi-instrument",
    "pytorch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/kobimusic/dettato"
Issues = "https://github.com/kobimusic/dettato/issues"
Models = "https://huggingface.co/collections/kobimusic/dettato"
Benchmark = "https://huggingface.co/datasets/kobimusic/dettato-benchmark"

[project.scripts]
dettato = "dettato.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dettato*"]
